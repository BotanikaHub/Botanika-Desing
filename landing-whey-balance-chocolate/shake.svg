<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260" role="img" aria-label="Shake de whey chocolate cremoso">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="cocoa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5330"/>
      <stop offset=".5" stop-color="#6e3d1f"/>
      <stop offset="1" stop-color="#502a13"/>
    </linearGradient>
    <linearGradient id="foam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e3cf"/>
      <stop offset="1" stop-color="#e2c8a6"/>
    </linearGradient>
  </defs>
  <ellipse cx="100" cy="246" rx="66" ry="10" fill="#000" opacity=".26"/>
  <!-- glass body -->
  <path d="M50 40 L150 40 L138 232 Q137 244 124 244 L76 244 Q63 244 62 232 Z" fill="url(#cocoa)"/>
  <!-- foam top -->
  <ellipse cx="100" cy="42" rx="50" ry="13" fill="url(#foam)"/>
  <ellipse cx="82" cy="39" rx="10" ry="6" fill="#fff" opacity=".5"/>
  <ellipse cx="112" cy="41" rx="7" ry="4" fill="#fff" opacity=".35"/>
  <!-- glass overlay -->
  <path d="M50 40 L150 40 L138 232 Q137 244 124 244 L76 244 Q63 244 62 232 Z" fill="url(#glass)"/>
  <path d="M58 48 L66 226" stroke="#fff" stroke-opacity=".25" stroke-width="4" stroke-linecap="round"/>
  <rect x="49" y="34" width="102" height="12" rx="6" fill="#f6efe1" opacity=".9"/>
  <!-- straw -->
  <rect x="118" y="10" width="7" height="60" rx="3.5" fill="#cf8a43" transform="rotate(10 121 40)"/>
</svg>
