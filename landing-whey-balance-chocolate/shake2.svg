<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 120" width="130" height="120" role="img" aria-label="Coqueteleira de whey">
  <defs>
    <linearGradient id="s2body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>
      <stop offset=".5" stop-color="#eee6d8" stop-opacity=".6"/>
      <stop offset="1" stop-color="#ddd0ba" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="s2shake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3bd8c"/>
      <stop offset="1" stop-color="#bd8a52"/>
    </linearGradient>
  </defs>
  <ellipse cx="60" cy="112" rx="32" ry="6" fill="#000" opacity=".22"/>
  <!-- corpo da coqueteleira -->
  <path d="M36 34 h48 v56 a14 14 0 0 1 -14 14 h-20 a14 14 0 0 1 -14 -14 Z" fill="url(#s2body)" stroke="#6f4426" stroke-opacity=".45" stroke-width="2"/>
  <!-- shake dentro -->
  <path d="M38 58 h44 v32 a14 14 0 0 1 -14 14 h-16 a14 14 0 0 1 -14 -14 Z" fill="url(#s2shake)"/>
  <!-- marcações -->
  <line x1="74" y1="48" x2="80" y2="48" stroke="#6f4426" stroke-opacity=".4" stroke-width="2" stroke-linecap="round"/>
  <line x1="74" y1="62" x2="80" y2="62" stroke="#6f4426" stroke-opacity=".4" stroke-width="2" stroke-linecap="round"/>
  <line x1="74" y1="76" x2="80" y2="76" stroke="#6f4426" stroke-opacity=".4" stroke-width="2" stroke-linecap="round"/>
  <!-- tampa -->
  <rect x="32" y="20" width="56" height="18" rx="7" fill="#4a52b8"/>
  <rect x="32" y="20" width="56" height="8" rx="4" fill="#5b63c9"/>
  <!-- bico flip -->
  <path d="M52 20 v-7 a8 8 0 0 1 16 0 v7" fill="none" stroke="#3a41a0" stroke-width="4" stroke-linecap="round"/>
  <!-- brilho -->
  <path d="M44 40 q-3 30 2 58" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3.4" stroke-linecap="round"/>
</svg>
