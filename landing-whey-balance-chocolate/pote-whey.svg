<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 372" width="260" height="372" role="img" aria-label="Pote de Whey Balance Chocolate">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1530"/>
      <stop offset=".16" stop-color="#22305c"/>
      <stop offset=".5" stop-color="#182348"/>
      <stop offset=".84" stop-color="#0e1836"/>
      <stop offset="1" stop-color="#080f26"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8cbb4"/>
      <stop offset=".2" stop-color="#f4ecdd"/>
      <stop offset=".5" stop-color="#efe5d3"/>
      <stop offset=".82" stop-color="#e7dcc7"/>
      <stop offset="1" stop-color="#cabfa6"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2650"/>
      <stop offset="1" stop-color="#111a3c"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eab173"/>
      <stop offset="1" stop-color="#cf8a43"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".25" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="130" cy="356" rx="86" ry="13" fill="#000" opacity=".28"/>
  <!-- body -->
  <rect x="34" y="60" width="192" height="288" rx="26" fill="url(#body)"/>
  <rect x="34" y="60" width="192" height="288" rx="26" fill="url(#sheen)"/>
  <rect x="34.5" y="60.5" width="191" height="287" rx="25.5" fill="none" stroke="#eab173" stroke-opacity=".18"/>
  <!-- lid -->
  <rect x="40" y="22" width="180" height="52" rx="16" fill="url(#lid)"/>
  <ellipse cx="130" cy="26" rx="90" ry="12" fill="#f6efe1"/>
  <rect x="40" y="66" width="180" height="8" rx="4" fill="#0c1430" opacity=".55"/>
  <!-- label -->
  <rect x="52" y="120" width="156" height="176" rx="14" fill="url(#label)" stroke="#cf8a43" stroke-opacity=".5"/>
  <text x="130" y="146" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13" letter-spacing="3" fill="#eab173">BOTANIKA</text>
  <text x="130" y="184" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="34" fill="#f3e7d6">WHEY</text>
  <text x="130" y="214" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="26" fill="#f3e7d6">BALANCE</text>
  <rect x="86" y="226" width="88" height="22" rx="11" fill="url(#grad)"/>
  <text x="130" y="241" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="12" letter-spacing="2" fill="#161022">CHOCOLATE</text>
  <text x="130" y="270" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" letter-spacing=".5" fill="#c9d2ea">WHEY CONCENTRADO + C-PURE®</text>
  <circle cx="96" cy="285" r="12" fill="none" stroke="#eab173" stroke-opacity=".7" stroke-width="1.4"/>
  <text x="96" y="289" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="10" fill="#eab173">23g</text>
  <text x="150" y="283" font-family="Helvetica,Arial,sans-serif" font-size="8.5" fill="#c9d2ea">PROTEÍNA</text>
  <text x="150" y="293" font-family="Helvetica,Arial,sans-serif" font-size="8.5" fill="#c9d2ea">POR PORÇÃO</text>
</svg>
