<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140" role="img" aria-label="Copo de shake de whey">
  <defs>
    <linearGradient id="s1glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#f3ece0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#e7dcc9" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="s1shake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9c79a"/>
      <stop offset=".55" stop-color="#d3a86e"/>
      <stop offset="1" stop-color="#b98246"/>
    </linearGradient>
  </defs>
  <!-- sombra -->
  <ellipse cx="60" cy="130" rx="34" ry="6" fill="#000" opacity=".22"/>
  <!-- copo (tapered) -->
  <path d="M34 40 L86 40 L80 124 A6 6 0 0 1 74 129 L46 129 A6 6 0 0 1 40 124 Z" fill="url(#s1glass)" stroke="#6f4426" stroke-opacity=".45" stroke-width="2"/>
  <!-- shake dentro -->
  <path d="M37 58 L83 58 L80 124 A6 6 0 0 1 74 129 L46 129 A6 6 0 0 1 40 124 Z" fill="url(#s1shake)"/>
  <!-- creme/espuma no topo -->
  <ellipse cx="60" cy="40" rx="26" ry="9" fill="#fcf7ee" stroke="#e7dcc9" stroke-width="1.5"/>
  <ellipse cx="52" cy="37" rx="7" ry="3.5" fill="#fff" opacity=".8"/>
  <ellipse cx="66" cy="39" rx="5" ry="2.6" fill="#fff" opacity=".6"/>
  <!-- canudo -->
  <rect x="66" y="14" width="7" height="34" rx="3.5" fill="#4a52b8" transform="rotate(12 69 30)"/>
  <rect x="66" y="14" width="7" height="12" rx="3.5" fill="#5b63c9" transform="rotate(12 69 30)"/>
  <!-- brilho no copo -->
  <path d="M42 52 q-2 30 3 66" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
</svg>
