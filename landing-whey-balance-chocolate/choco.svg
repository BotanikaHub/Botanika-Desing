<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Quadradinho de chocolate">
  <defs>
    <linearGradient id="choc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a4526"/>
      <stop offset=".5" stop-color="#5a3016"/>
      <stop offset="1" stop-color="#3f2010"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a2712"/>
      <stop offset="1" stop-color="#2c1509"/>
    </linearGradient>
  </defs>
  <!-- sombra -->
  <ellipse cx="60" cy="99" rx="42" ry="7" fill="#000" opacity=".3"/>
  <!-- profundidade (lateral do pedaço) -->
  <rect x="24" y="32" width="72" height="62" rx="11" fill="#2a1308"/>
  <!-- face de cima -->
  <rect x="24" y="26" width="72" height="62" rx="11" fill="url(#choc)"/>
  <!-- borda chanfrada (brilho) -->
  <rect x="24.6" y="26.6" width="70.8" height="60.8" rx="10.4" fill="none" stroke="#a86a3c" stroke-opacity=".6" stroke-width="1.2"/>
  <!-- quadrado interno rebaixado -->
  <rect x="34" y="35" width="52" height="44" rx="7" fill="url(#inner)"/>
  <rect x="34" y="35" width="52" height="44" rx="7" fill="none" stroke="#1f0e06" stroke-opacity=".5" stroke-width="1.4"/>
  <!-- brilho no topo -->
  <path d="M34 33 h52 a5 5 0 0 1 5 5 v3 H29 v-3 a5 5 0 0 1 5-5z" fill="#fff" opacity=".14"/>
  <ellipse cx="46" cy="45" rx="9" ry="4" fill="#fff" opacity=".1"/>
</svg>
