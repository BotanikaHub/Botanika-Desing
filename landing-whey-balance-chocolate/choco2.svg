<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 110" width="150" height="110" role="img" aria-label="Pedaço de chocolate — dois quadrados">
  <defs>
    <linearGradient id="c2top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7f4827"/>
      <stop offset=".5" stop-color="#5c3117"/>
      <stop offset="1" stop-color="#3f2010"/>
    </linearGradient>
    <linearGradient id="c2in" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a2712"/>
      <stop offset="1" stop-color="#2c1509"/>
    </linearGradient>
  </defs>
  <ellipse cx="75" cy="96" rx="58" ry="8" fill="#000" opacity=".3"/>
  <!-- profundidade -->
  <rect x="14" y="30" width="122" height="60" rx="12" fill="#2a1308"/>
  <!-- face de cima -->
  <rect x="14" y="24" width="122" height="60" rx="12" fill="url(#c2top)"/>
  <rect x="14.6" y="24.6" width="120.8" height="58.8" rx="11.4" fill="none" stroke="#a86a3c" stroke-opacity=".6" stroke-width="1.2"/>
  <!-- dois quadrados internos rebaixados -->
  <rect x="24" y="33" width="46" height="42" rx="7" fill="url(#c2in)" stroke="#1f0e06" stroke-opacity=".5" stroke-width="1.4"/>
  <rect x="80" y="33" width="46" height="42" rx="7" fill="url(#c2in)" stroke="#1f0e06" stroke-opacity=".5" stroke-width="1.4"/>
  <!-- brilho -->
  <path d="M24 31 h102 a5 5 0 0 1 5 5 v3 H19 v-3 a5 5 0 0 1 5-5z" fill="#fff" opacity=".13"/>
  <ellipse cx="40" cy="43" rx="10" ry="4" fill="#fff" opacity=".1"/>
</svg>
